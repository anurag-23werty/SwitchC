[project]
name = "khata"
version = "0.1.0"
description = "An agentic accounts-payable room on Switch: AI agents and a finance team process vendor invoices together in chat."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.7",
    "fastmcp>=2.10",
    "httpx>=0.27",
    "langfuse>=3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pdfplumber>=0.11",
    "pillow>=13.0.0",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6",
    "reportlab>=4.2",
    "uvicorn>=0.30",
]

[project.scripts]
khata = "khata.cli:main"

[dependency-groups]
dev = [
    "deepeval>=4.3.3",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:deepeval"

[tool.ruff]
target-version = "py311"
extend-exclude = ["vendor", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["khata"]
