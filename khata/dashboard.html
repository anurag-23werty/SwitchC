<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khata Ledger</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1b18; --muted: #6b675d; --line: #e4e1d8;
  --accent: #0f766e; --accent-soft: #e0f2ef; --warn: #b45309; --warn-soft: #fdf1e1;
  --bad: #b91c1c; --bad-soft: #fde8e8; --good: #15803d; --good-soft: #e3f4e8;
  --hold: #7c3aed; --hold-soft: #efe8fd;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412; --panel: #1d1c1a; --ink: #ecebe6; --muted: #a39f94; --line: #2f2d29;
    --accent: #2dd4bf; --accent-soft: #123a36; --warn: #f59e0b; --warn-soft: #3a2a10;
    --bad: #f87171; --bad-soft: #3d1a1a; --good: #4ade80; --good-soft: #13321f;
    --hold: #a78bfa; --hold-soft: #2a2140;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
header { display: flex; align-items: baseline; gap: 16px; padding: 18px 24px 0; flex-wrap: wrap; }
header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
header h1 span { color: var(--accent); }
header .sub { color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 4px; padding: 12px 24px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { background: none; border: 0; padding: 8px 12px; font: inherit; color: var(--muted);
  border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
main { padding: 20px 24px 48px; max-width: 1400px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .h { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
.card h2 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--accent-soft); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.s-PAYMENT_DRAFTED, .s-APPROVED { background: var(--good-soft); color: var(--good); }
.s-REJECTED { background: var(--bad-soft); color: var(--bad); }
.s-ON_HOLD { background: var(--hold-soft); color: var(--hold); }
.s-AWAITING_APPROVAL { background: var(--warn-soft); color: var(--warn); }
.s-other { background: var(--line); color: var(--muted); }
.flag { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 0 6px; margin: 1px 2px 1px 0;
  border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
.flag.hard { border-color: var(--bad); color: var(--bad); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.filters button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
  padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
.filters button.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.detail { position: fixed; inset: 0 0 0 auto; width: min(760px, 100%); background: var(--panel); border-left: 1px solid var(--line);
  box-shadow: -12px 0 32px rgba(0,0,0,.12); overflow-y: auto; transform: translateX(100%); transition: transform .18s ease; z-index: 10; }
.detail.open { transform: none; }
.detail .top { position: sticky; top: 0; background: var(--panel); padding: 14px 18px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.detail .top h3 { margin: 0; font-size: 16px; }
.detail .body { padding: 6px 18px 32px; }
.detail h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
.close { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
.timeline { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); }
.timeline li { padding: 4px 0 10px 14px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 10px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--accent); }
.timeline .when { color: var(--muted); font-size: 12px; font-family: var(--mono); }
.note { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
.note .meta { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; }
.kv div:nth-child(odd) { color: var(--muted); }
.banner { border: 1px solid var(--bad); background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 8px 12px; margin-top: 12px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; margin: 0; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
@media (max-width: 640px) {
  header, nav, main { padding-left: 16px; padding-right: 16px; }
  .hide-sm { display: none; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .tile .v { font-size: 18px; }
  .detail .body, .detail .top { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<header>
  <h1><span>Khata</span> ledger</h1>
  <div class="sub">Read-only view of Khata's Postgres. Decisions are made in the Switch room (#ap-desk); nothing here pays or approves.</div>
</header>
<nav id="tabs">
  <button data-tab="queue" class="on">Invoices</button>
  <button data-tab="audit">Audit trail</button>
  <button data-tab="rules">Policy</button>
  <button data-tab="metrics">Metrics</button>
</nav>
<main id="main"></main>
<aside class="detail" id="detail" aria-live="polite"></aside>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const token = new URLSearchParams(location.search).get("token");
const api = async (path) => {
  const r = await fetch(path, { headers: token ? { Authorization: "Bearer " + token } : {} });
  if (!r.ok) throw new Error(path + ": HTTP " + r.status);
  return r.json();
};
const inr = (v) => v == null ? "—" : "₹" + Number(v).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const when = (t) => t ? new Date(t).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) : "";
const label = (s) => s ? s.replaceAll("_", " ").toLowerCase().replace(/^./, (c) => c.toUpperCase()) : "";
const pill = (s) => `<span class="pill ${["PAYMENT_DRAFTED","APPROVED","REJECTED","ON_HOLD","AWAITING_APPROVAL"].includes(s) ? "s-" + s : "s-other"}">${esc(label(s))}</span>`;
const HARD = new Set(["BANK_CHANGE", "INJECTION", "DUPLICATE", "VENDOR_UNKNOWN", "GSTIN_MISMATCH"]);
const flags = (fs) => (fs || []).map((f) => `<span class="flag ${HARD.has(f) ? "hard" : ""}">${esc(f)}</span>`).join("") || '<span class="muted">—</span>';
let tab = "queue", filter = null;

async function render() {
  const main = $("#main");
  try {
    main.innerHTML = await ({ queue, audit, rules, metrics })[tab]();
  } catch (e) {
    main.innerHTML = `<div class="banner">Couldn't load: ${esc(e.message)}</div>`;
  }
  main.querySelectorAll("[data-inv]").forEach((el) => el.addEventListener("click", () => openInvoice(el.dataset.inv)));
  main.querySelectorAll("[data-filter]").forEach((el) => el.addEventListener("click", () => { filter = el.dataset.filter || null; render(); }));
}

async function tiles() {
  const s = await api("/api/summary");
  const n = (st) => (s.by_state[st] || {}).n || 0;
  return `<div class="tiles">
    <div class="tile"><div class="k">Waiting for a person</div><div class="v">${s.waiting}</div><div class="h">${n("AWAITING_APPROVAL")} approval · ${n("ON_HOLD")} on hold</div></div>
    <div class="tile"><div class="k">Drafted for payment</div><div class="v">${inr(s.drafted_total)}</div><div class="h">${n("PAYMENT_DRAFTED")} invoices · never paid by Khata</div></div>
    <div class="tile"><div class="k">Rejected</div><div class="v">${n("REJECTED")}</div><div class="h">vendor must reissue or a person said no</div></div>
    <div class="tile"><div class="k">Auto-approved</div><div class="v">${s.auto_approved}</div><div class="h">by policy, no person needed</div></div>
    <div class="tile"><div class="k">Policy in force</div><div class="v">v${s.policy_version}</div><div class="h">from the rules table</div></div>
  </div>`;
}

async function queue() {
  const rows = await api("/api/invoices" + (filter ? "?state=" + filter : ""));
  const states = ["AWAITING_APPROVAL", "ON_HOLD", "PAYMENT_DRAFTED", "REJECTED"];
  const body = rows.map((r) => `<tr class="click" data-inv="${r.id}">
      <td class="mono">${r.id}</td>
      <td><b>${esc(r.vendor_code || "?")}</b> <span class="mono">${esc(r.invoice_no || r.source_file || "")}</span><div class="muted hide-sm">${esc(r.vendor_name || "")}</div></td>
      <td class="num">${inr(r.total)}</td>
      <td>${pill(r.state)}</td>
      <td>${flags(r.flags)}</td>
      <td class="hide-sm">${esc(r.route || "")}${r.approvers?.length ? ` <span class="muted">@${r.approvers.map(esc).join(", @")}</span>` : ""}</td>
      <td class="hide-sm muted">${r.rule_version ? "v" + r.rule_version : ""}</td>
      <td class="hide-sm muted">${when(r.updated_at)}</td></tr>`).join("");
  return (await tiles()) + `<div class="filters">
      <button data-filter="" class="${!filter ? "on" : ""}">All</button>
      ${states.map((s) => `<button data-filter="${s}" class="${filter === s ? "on" : ""}">${label(s)}</button>`).join("")}
    </div>
    <div class="card"><div class="scroll"><table>
      <thead><tr><th>#</th><th>Invoice</th><th class="num">Total</th><th>State</th><th>Flags</th><th class="hide-sm">Route</th><th class="hide-sm">Policy</th><th class="hide-sm">Updated</th></tr></thead>
      <tbody>${body || '<tr><td colspan="8" class="empty">No invoices yet. Post a PDF in #ap-desk.</td></tr>'}</tbody>
    </table></div></div>`;
}

async function audit() {
  const rows = await api("/api/audit?limit=300");
  return `<div class="card"><h2>Audit trail <span class="muted">(append-only; newest first)</span></h2><div class="scroll"><table>
    <thead><tr><th>When</th><th>Invoice</th><th>Actor</th><th>Action</th><th>State</th><th>Reason</th></tr></thead>
    <tbody>${rows.map((a) => `<tr ${a.invoice_id ? `class="click" data-inv="${a.invoice_id}"` : ""}>
      <td class="mono muted">${when(a.created_at)}</td>
      <td class="mono">${esc(a.invoice_no || (a.invoice_id ?? "—"))}</td>
      <td>${esc(a.actor)} <span class="muted">${esc(a.actor_kind)}</span></td>
      <td class="mono">${esc(a.action)}</td>
      <td>${a.to_state ? `${esc(label(a.from_state) || "·")} → ${pill(a.to_state)}` : ""}</td>
      <td>${esc(a.reason || "")}</td></tr>`).join("") || '<tr><td colspan="6" class="empty">Nothing yet.</td></tr>'}</tbody>
  </table></div></div>`;
}

async function rules() {
  const r = await api("/api/rules");
  const versions = r.versions.map((v) => {
    const p = v.policy, ex = p.vendor_exceptions || [];
    return `<div class="card"><h2>v${v.version} ${v.active ? '<span class="pill s-PAYMENT_DRAFTED">active</span>' : '<span class="pill s-other">superseded</span>'}</h2>
      <div style="padding:12px 14px">
        <div>${esc(v.change_summary)}</div>
        <div class="muted" style="margin:4px 0 10px">Proposed by ${esc(v.proposed_by)} · approved by ${esc(v.approved_by)} · ${when(v.created_at)}</div>
        <div class="kv">
          <div>Auto-approve below</div><div>${inr(p.auto_approve_below)}</div>
          <div>Finance manager up to</div><div>${inr(p.manager_up_to)} (above: manager, then owner)</div>
          <div>Variance tolerance</div><div>${esc(p.variance_pct)}%</div>
          <div>Approvers</div><div>${Object.entries(p.approvers).map(([k, u]) => `${esc(label(k))}: @${esc(u)}`).join(" · ")}</div>
          <div>Vendor exceptions</div><div>${ex.length ? ex.map((e) => `<b>${esc(e.vendor_code)}</b> ${esc(e.flag)} up to ${esc(e.max_variance_pct)}% <span class="muted">(after ${esc((e.evidence || []).join(", "))}; approved by ${esc(e.approved_by)})</span>`).join("<br>") : '<span class="muted">none</span>'}</div>
        </div></div></div>`;
  }).join("");
  const props = r.proposals.map((p) => `<tr>
      <td class="mono">#${p.id}</td><td>${pill(p.status === "approved" ? "PAYMENT_DRAFTED" : p.status === "rejected" ? "REJECTED" : "AWAITING_APPROVAL").replace(/>[^<]+</, ">" + esc(p.status) + "<")}</td>
      <td>${esc(p.summary)}<div class="muted">${p.evidence.map((e) => `${esc(e.invoice_no)} +${esc(e.variance_pct)}% (${esc(e.approved_by)}: “${esc(e.reason)}”)`).join("<br>")}</div></td>
      <td>${p.decided_by ? esc(p.decided_by) + ": " + esc(p.decision_reason) : '<span class="muted">waiting for @' + esc(p.owner) + "</span>"}</td>
      <td>${p.new_version ? "→ v" + p.new_version : ""}</td></tr>`).join("");
  return `<div class="card"><h2>Policy Steward proposals</h2><div class="scroll"><table>
      <thead><tr><th>#</th><th>Status</th><th>Proposal and evidence</th><th>Decision</th><th></th></tr></thead>
      <tbody>${props || '<tr><td colspan="5" class="empty">No proposals yet. The Steward proposes a rule after people approve the same exception twice for a vendor.</td></tr>'}</tbody>
    </table></div></div>` + versions;
}

async function metrics() {
  const s = await api("/api/summary");
  const total = Object.values(s.by_state).reduce((a, b) => a + b.n, 0) || 1;
  const states = Object.entries(s.by_state).sort((a, b) => b[1].n - a[1].n);
  const ev = s.eval;
  const pct = (v) => v == null ? "n/a" : v.toFixed(1) + "%";
  return (await tiles()) + `<div class="grid2">
    <div class="card"><h2>Invoices by state</h2><div style="padding:12px 14px">${states.map(([k, v]) => `
      <div style="display:flex;justify-content:space-between;margin-top:8px">${pill(k)}<span class="mono">${v.n} · ${inr(v.total)}</span></div>
      <div class="bar" style="margin-top:4px"><span style="width:${(v.n / total) * 100}%"></span></div>`).join("") || '<div class="empty">No invoices yet.</div>'}</div></div>
    <div class="card"><h2>Exceptions raised</h2><div class="scroll"><table><tbody>${s.flags.map((f) => `<tr><td>${flags([f.flag])}</td><td class="num">${f.n}</td></tr>`).join("") || '<tr><td class="empty">None.</td></tr>'}</tbody></table></div></div>
    <div class="card"><h2>Decisions</h2><div class="scroll"><table><tbody>${s.decisions.map((d) => `<tr><td>${esc(d.decider_kind)}</td><td>${esc(d.decision)}</td><td class="num">${d.n}</td></tr>`).join("") || '<tr><td class="empty">None.</td></tr>'}</tbody></table></div></div>
    <div class="card"><h2>Agents and models</h2><div style="padding:12px 14px" class="kv">
      <div>LLM calls</div><div>${s.llm.calls} (${s.llm.cached} cached, ${s.llm.failed} failed)</div>
      <div>Tokens</div><div>${Number(s.llm.prompt_tokens).toLocaleString()} in · ${Number(s.llm.output_tokens).toLocaleString()} out</div>
      <div>Median live call</div><div>${s.llm.median_ms ? Math.round(s.llm.median_ms) + " ms" : "n/a"}</div>
      <div>Cost</div><div>$${s.llm.cost_usd.toFixed(2)} (free tiers only)</div>
      <div>Tool calls</div><div>${s.tools.calls} (${s.tools.denied} denied by the policy engine)</div>
    </div></div>
    <div class="card"><h2>Latest eval (31 hand-labelled invoices)</h2><div style="padding:12px 14px" class="kv">${ev ? `
      <div>Run</div><div class="mono">${esc(ev.run)}</div>
      <div>Fraud recall</div><div>${pct(ev.fraud_recall)}</div>
      <div>Duplicate recall</div><div>${pct(ev.duplicate_recall)}</div>
      <div>Injection resistance</div><div>${pct(ev.injection_resistance)}</div>
      <div>Decision accuracy</div><div>${pct(ev.decision_accuracy)}</div>` : '<div class="muted">No full live run recorded.</div><div>Run <span class="mono">make eval</span></div>'}
    </div></div>
  </div>`;
}

function readers(rt) {
  const r = (rt.extracted || {}).readings || {};
  return [r.a, r.b].filter((x) => x && x.model).map((x) => esc(x.model) + (x.error ? " (failed)" : "")).join(" · ");
}

async function openInvoice(id) {
  history.replaceState(null, "", "#inv=" + id);
  const d = $("#detail");
  d.classList.add("open");
  d.innerHTML = '<div class="top"><h3>Loading…</h3></div>';
  try {
    const i = await api("/api/invoices/" + id);
    const rt = i.route || {};
    const notes = (i.notes || []).filter((n) => n.kind !== "reading").map((n) => {
      const c = n.content || {};
      const body = n.kind === "analysis"
        ? `<b>${esc(c.headline || "")}</b><div>${esc(c.explanation || "")}</div>${(c.precedents || []).map((p) => `<div class="muted">Precedent ${esc(p.invoice_no)}: ${esc(p.what_was_decided || "")}</div>`).join("")}${(c.questions_for_approver || []).map((q) => `<div class="muted">Check: ${esc(q)}</div>`).join("")}<div class="muted">Suggests: ${esc(c.suggested_action || "")} (advice only)</div>`
        : n.kind === "audit"
        ? `<b>${c.consistent ? "Agrees with the Analyst's note" : "Disagrees with the Analyst's note"}</b>${(c.issues || []).map((x) => `<div>Issue: ${esc(typeof x === "string" ? x : JSON.stringify(x))}</div>`).join("")}${(c.reasons || []).map((x) => `<div class="muted">${esc(x)}</div>`).join("")}`
        : `<pre>${esc(JSON.stringify(c, null, 1))}</pre>`;
      return `<div class="note"><div class="meta">${esc(n.agent)} · ${esc(n.kind)} · ${esc(n.provider || "")} ${esc(n.model || "")}</div>${body}</div>`;
    }).join("");
    d.innerHTML = `<div class="top"><div><h3>${esc(i.vendor_name || "Unknown vendor")} · <span class="mono">${esc(i.invoice_no || "#" + i.id)}</span></h3>
        <div style="margin-top:6px">${pill(i.state)} <b>${inr(i.total)}</b> ${flags(i.flags)}</div></div>
        <button class="close" id="x">Close</button></div>
      <div class="body">
        ${rt.callback_instruction ? `<div class="banner"><b>Hard stop.</b> ${esc(rt.callback_instruction)}</div>` : ""}
        <h4>Invoice</h4><div class="kv">
          <div>Date</div><div>${esc(i.invoice_date || "")}</div><div>PO</div><div class="mono">${esc(i.po_number || "—")}</div>
          <div>GSTIN</div><div class="mono">${esc(i.supplier_gstin || "")}</div>
          <div>Taxable · tax</div><div>${inr(i.taxable_value)} · CGST ${inr(i.cgst)} · SGST ${inr(i.sgst)} · IGST ${inr(i.igst)}</div>
          <div>Pays to</div><div class="mono">${esc(i.bank_account || "")} · ${esc(i.ifsc || "")}</div>
          <div>Route</div><div>${esc(rt.route || "—")} ${rt.approvers?.length ? "@" + rt.approvers.map(esc).join(", @") : ""}</div>
          ${readers(rt) ? `<div>Two readers</div><div>${readers(rt)}</div>` : ""}
          ${rt.source_file ? `<div>Source</div><div class="mono">${esc(rt.source_file.split("/").pop())}</div>` : ""}</div>
        <h4>Lines</h4><div class="scroll"><table><thead><tr><th>Description</th><th>HSN</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>
          ${(i.lines || []).map((l) => `<tr><td>${esc(l.description)}</td><td class="mono">${esc(l.hsn || "")}</td><td class="num">${esc(l.qty)}</td><td class="num">${inr(l.rate)}</td><td class="num">${inr(l.amount)}</td></tr>`).join("")}</tbody></table></div>
        <h4>Decisions</h4>${(i.decisions || []).map((x) => `<div class="note"><div class="meta">${[`${esc(x.decided_by)} (${esc(x.decider_kind)})`, x.approval_step ? esc(x.approval_step) + " step" : "", "policy v" + esc(x.rule_version), when(x.created_at)].filter(Boolean).join(" · ")}</div><b>${esc(x.decision)}</b>: ${esc(x.reason)}</div>`).join("") || '<div class="muted">None yet.</div>'}
        ${i.payment ? `<h4>Payment draft</h4><div class="kv"><div>Batch</div><div class="mono">${esc(i.payment.batch_ref)} (${esc(i.payment.status)})</div><div>Amount</div><div>${inr(i.payment.amount)}</div><div>To</div><div>${esc(i.payment.beneficiary_name)} · <span class="mono">${esc(i.payment.beneficiary_account)} · ${esc(i.payment.ifsc)}</span></div><div>File</div><div class="mono">${esc(i.payment.csv_path || "")}</div></div>` : ""}
        <h4>Agent notes</h4>${notes || '<div class="muted">None.</div>'}
        <h4>History</h4><ul class="timeline">${(i.history || []).map((h) => `<li><div class="when">${when(h.created_at)} · ${esc(h.actor)}</div><div><span class="mono">${esc(h.action)}</span>${h.to_state ? " → " + pill(h.to_state) : ""}</div><div class="muted">${esc(h.reason || "")}</div></li>`).join("")}</ul>
        <h4>Tool calls (${(i.tool_calls || []).length})</h4><div class="scroll"><table><tbody>${(i.tool_calls || []).map((t) => `<tr><td>${esc(t.agent)}</td><td class="mono">${esc(t.tool)}</td><td>${t.allowed ? "" : '<span class="pill s-REJECTED">denied</span>'} ${esc(t.error || "")}</td><td class="num muted">${t.duration_ms ?? ""} ms</td></tr>`).join("")}</tbody></table></div>
        <h4>LLM calls (${(i.llm_calls || []).length})</h4><div class="scroll"><table><tbody>${(i.llm_calls || []).map((c) => `<tr><td>${esc(c.agent)}</td><td class="mono">${esc(c.model || "")}</td><td>${c.ok ? "" : '<span class="pill s-REJECTED">failed</span>'} ${c.cached ? '<span class="muted">cached</span>' : ""}</td><td class="num muted">${c.cached ? "" : (c.duration_ms ?? "") + " ms"}</td></tr>`).join("")}</tbody></table></div>
      </div>`;
  } catch (e) {
    d.innerHTML = `<div class="top"><h3>Couldn't load invoice ${esc(id)}</h3><button class="close" id="x">Close</button></div><div class="body"><div class="banner">${esc(e.message)}</div></div>`;
  }
  $("#x").addEventListener("click", closeDetail);
}

function closeDetail() { $("#detail").classList.remove("open"); history.replaceState(null, "", location.pathname + location.search); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  render();
});
render();
const deep = location.hash.match(/^#inv=(\d+)/);
if (deep) openInvoice(deep[1]);
setInterval(() => { if (!$("#detail").classList.contains("open")) render(); }, 15000);
</script>
</body>
</html>
